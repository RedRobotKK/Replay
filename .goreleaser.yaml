# GoReleaser configuration. A pushed tag vX.Y.Z builds every platform from
# CI, publishes archives with checksums, and signs the checksum file with
# Sigstore keyless signing so users can verify a download without trusting
# the release page. Validate locally with: go run github.com/goreleaser/goreleaser/v2@latest check
version: 2

project_name: replay

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: replay
    main: ./cmd/replay
    binary: replay
    env:
      - CGO_ENABLED=0
    # Windows is not built. It is not supported and has never been tested
    # there: the CI job failed at `go vet` on a unix-tagged helper for as long
    # as it existed, so the first Windows test run ever produced, on
    # 2026-09-06, failed fourteen tests. The ones that matter assert Unix
    # file-mode semantics guarding the ledger and the masking vault.
    #
    # v0.4.0 shipped Windows archives anyway, next to release notes saying
    # Windows was unsupported. They were deleted after publication. A binary
    # that runs while not keeping the promises its own tests check is worse
    # than no binary, and shipping one under a note saying so is worse again.
    #
    # Restore this line when RELEASE-CRITERIA.md's platform gate is met.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/RedRobotKK/Replay/internal/version.Version={{ .Version }}
      - -X github.com/RedRobotKK/Replay/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/RedRobotKK/Replay/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      # Kept deliberately while Windows is not built, so restoring the goos
      # line above is the only edit needed. Dead config, not an oversight.
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - id: checksums
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

sboms:
  - id: archive
    artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - "^chore\\(release\\):"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Verify a download

    Every release ships `checksums.txt` signed with Sigstore keyless signing. Verify before running anything:

    ```sh
    cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
      --certificate-identity-regexp 'https://github.com/RedRobotKK/Replay/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```
