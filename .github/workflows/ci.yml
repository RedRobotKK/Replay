name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede a branch's own in-flight run, never main's.
#
# cancel-in-progress used to apply everywhere, and on 2026-09-09 that meant 11
# of 14 consecutive main commits had a CANCELLED run and two had a completed
# one. Merges landed minutes apart and each cancelled the last, so the branch
# every release is cut from was the least-verified ref in the repository.
#
# Every pull request was green before merging, which is not the same claim: a
# PR is tested against its base, and main is what those merges add up to. The
# job most likely to be killed is the slowest, and the slowest here is the
# 25-minute mutation catalogue — the one job whose whole purpose is catching a
# guard that stopped working while nobody was looking.
#
# On a pull request the cancellation is still right: a superseded push is dead
# work and the next one re-runs everything.
concurrency:
  # On main every commit gets its OWN group, which is what actually stops the
  # cancelling. cancel-in-progress alone was not enough: with a shared group,
  # GitHub cancels a PENDING run when a newer one queues behind it, so with a
  # 25-minute job and merges minutes apart most main runs still ended cancelled
  # — cancelled while queued rather than while running, indistinguishable in the
  # run list and equally unverified.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # bash on every OS: PowerShell splits "-coverprofile=coverage.out"
    # into two arguments and go test then looks for a package named .out.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "run 'go mod tidy' and commit" && exit 1)
      - name: Vet
        run: go vet ./...
      # Everywhere the binary actually runs.
      #
      # Scoped away from Windows because the binary REFUSES there (see
      # cmd/replay/platformguard.go), so every test that calls run() fails, and
      # it fails correctly: those tests assert behaviour the binary has just
      # declared it will not perform on that platform. Demanding they pass
      # would be demanding Windows do the thing the refusal exists to prevent,
      # and the cheapest way to get the tick back would be to delete the
      # refusal.
      #
      # This is not a loss of coverage. It is the end of a false one. The
      # Windows leg was green for weeks because internal/ownerdir's check is a
      # no-op there: 40% statement coverage against 100% on ubuntu, and
      # twenty-two tests skipping with "Unix permission bits".
      - name: Test
        if: matrix.os != 'windows-latest'
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      # What is true on Windows: the tree compiles, and every package with no
      # platform refusal in it passes.
      - name: Test the packages that do not refuse
        if: matrix.os == 'windows-latest'
        run: go test -race -count=1 ./internal/...
      # And the refusal itself, against the built artifact.
      #
      # This is the only end-to-end evidence anywhere that the refusal reaches a
      # user, and before 2026-09-13 it was checked by nothing. A check against
      # the source is what passed for weeks while the artifact went unexamined.
      - name: Windows refuses
        if: matrix.os == 'windows-latest'
        run: |
          go build -trimpath -o replay.exe ./cmd/replay
          set +e
          out=$(./replay.exe version 2>&1 >/dev/null)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "FAIL: the Windows build ran the command instead of refusing." >&2
            exit 1
          fi
          if [ "$code" -eq 3 ]; then
            echo "FAIL: exit 3 is exitGateBreached, the only code that may block a merge." >&2
            echo "A platform that cannot be evaluated is not a measured breach." >&2
            exit 1
          fi
          case "$out" in
            *Windows*ownerdir*) ;;
            *) echo "FAIL: the refusal does not name Windows and ownerdir, so a user" >&2
               echo "cannot tell what specifically is not being done for them." >&2
               exit 1 ;;
          esac
          echo "ok: the Windows build refuses, exit $code, and says why."
      # Enforced on one runner, printed on the rest.
      #
      # Coverage is not comparable across the matrix: files tagged
      # //go:build unix are compiled out on Windows, so the same tree reports
      # a different total there. One floor applied to three runners would be
      # too low to mean anything on Linux or wrong on Windows.
      #
      # Before this, the step printed the total and nothing read it. A number
      # printed into a log that no step consumes is the same shape as a test
      # that cannot fail: it looks like a check and nothing depends on it.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage-gate.sh coverage.out
      - name: Coverage
        if: matrix.os == 'macos-latest'
        run: go tool cover -func=coverage.out | tail -1
      - name: Build
        run: go build -trimpath ./...
      # What the binary prints, not what the tree says.
      #
      # v0.5.0 shipped a denominator counting transcripts and a price table
      # dated 2026-06-24, both of which the tree had already moved past. Every
      # check here ran against the source and none against the artifact, so
      # nothing compared them. This runs the built binary on a fixture and
      # reads its output back.
      # Linux only. What is being checked is the text the binary prints, which
      # does not vary by platform, so running it three times checks one thing
      # three times. Windows also has no make on the runner and would name the
      # binary replay.exe, so the matrix build is the wrong place to ask.
      # The release workflow runs the same script against the real published
      # artifact, which is the run that matters.
      - name: Check the built binary
        if: runner.os == 'Linux'
        run: |
          make build
          ./scripts/release-check.sh ./bin/replay
      # The installer quotes the calibration corpus. Nothing connected the
      # sentence to the document it came from, so the document could be
      # regenerated and the sentence left behind, or the date dropped and the
      # snapshot read as a standing property of the tool.
      - name: Check the installer's corpus figures
        if: runner.os == 'Linux'
        run: ./scripts/corpus-figures-check.sh

  # The matrix above pins Go to go.mod, so a change in a newer standard
  # library is invisible to it. That is how a shutdown bug reached main:
  # only the release pipeline, which runs on the toolchain GoReleaser
  # requires, exposed it. This job is the guard. It blocks on purpose --
  # a standard-library change that breaks Replay is worth knowing about
  # before a release rather than after; make it continue-on-error if a Go
  # release ever holds up unrelated work.
  go-latest:
    name: Go (latest release)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true
      - name: Go version under test
        run: go version
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.5

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # go.mod has no third-party requires, and the README badge says so. That
      # removes the transitive-dependency problem; it does not remove the
      # dependency. Every line this binary runs that it did not write comes from
      # the standard library and the toolchain that compiles it, and both move.
      # The go-latest job already exists because a stdlib shutdown change broke
      # this project once, so the empirical guard is here and the declarative one
      # was not.
      #
      # govulncheck is the right tool rather than a generic scanner because it
      # reports only vulnerabilities in code paths actually reachable from this
      # module, so a finding here is a finding about Replay and not about a
      # package it happens to link.
      #
      # Pinned, for the reason the release workflow spells out about cosign: an
      # action SHA pins the action, never the tool it fetches.
      - name: Vulnerabilities in reachable code
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  x402-e2e:
    name: x402 end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The unit tests drive the 402 path through a transport hook, which proves
      # the parsing and the prose. They cannot prove that the shipped binary
      # refuses plain http, verifies a certificate chain, gets its exit codes to
      # a shell, or leaves no file behind when a feed demands payment. This runs
      # the real binary against a real TLS listener and asserts all four.
      #
      # X402_E2E_REQUIRED turns a missing docker daemon into a failure here. The
      # script skips without it so a developer is told why rather than handed a
      # broken build, and a check that silently skips on the machine that
      # matters is a check that cannot fail.
      - name: Run the x402 harness
        env:
          X402_E2E_REQUIRED: "1"
        run: ./scripts/x402-e2e/e2e.sh

  ledger-bench:
    name: ledger bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The benchmark is a published claim about how four products account for
      # tokens, and a published claim nobody re-checks is exactly what this
      # repository keeps finding. The fixture is committed, so every figure here
      # is a property of the scoring rule rather than of the runner.
      #
      # It also asserts that NOT MEASURED never becomes a number. Two of the four
      # products cannot be scored from outside, and an unknown quietly rendered
      # as a zero is the single defect class found most often in this tree.
      - name: Run the ledger benchmark
        run: ./scripts/ledger-bench/run.sh

  cli-blueprint:
    name: cli blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: true
      # docs/CLI.md is generated from the binary, so the only way it goes wrong
      # is by not being regenerated after a flag changes. This notices. It
      # carries no date and no build string for the reason the screen images
      # exclude the doctor screen: a generated artifact that embeds today fails
      # every morning, and a check that fails daily gets switched off.
      - name: Check the CLI reference against the binary
        run: ./scripts/cli-blueprint/check.sh

  tui-audit:
    name: tui layout audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: true
      # The committed SVGs pin what one width looks like. They cannot tell you
      # whether the layout survives a narrower terminal or a Japanese locale,
      # where East Asian Ambiguous characters are two cells wide instead of one.
      # This renders all nine screens across four widths and both locales.
      - name: Audit every TUI screen
        run: ./scripts/tui-audit/run.sh

  merge-guard:
    name: merge result
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, for the same reason guard-reachability
    # below says so: there has to be a base to merge into.
    #
    # GITHUB_BASE_REF is set only for pull_request events. On a push to main it
    # is empty, so the step below ran `git fetch --no-tags origin ""` and then
    # `merge-guard origin/`, and failed. Every push to main, since the job was
    # written.
    #
    # That is the defect this repository keeps naming in other people's work and
    # had shipped in its own: a check that goes red for a structural reason on
    # every merge is a check nobody reads, and a check nobody reads is how the
    # vendored installer went stale for two days with a green board. main has
    # been red for three consecutive runs with all twelve other jobs passing.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Every other job here checks this branch. This one checks the branch
      # merged into its base, which is the only thing that will exist after
      # the button is pressed and the only thing nothing else looks at.
      - name: Compile the merge, not the branch
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          go run scripts/merge-guard/main.go "origin/$GITHUB_BASE_REF"

  guard-reachability:
    name: guard reachability
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tool diffs against the base branch, so it needs history and the
          # base ref present. A shallow clone has neither.
          fetch-depth: 0
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: true
      # Neutralise every conditional this pull request touches and report the
      # ones no test observes.
      #
      # This exists because of what happened on 2026-09-09: 23 pull requests
      # merged in fourteen hours, authored and merged by the same agent, CI
      # green throughout, and three of them carrying defects. All three were
      # found by disabling a guard and watching the suite stay green. None by
      # reading the diff.
      #
      # It is scoped to the diff, so it costs seconds where the full mutant
      # catalogue costs eleven minutes, and it runs on every pull request
      # instead of on a tag nobody passes.
      - name: Neutralise the guards this change touches
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          go run scripts/guard-reachability/main.go "origin/$GITHUB_BASE_REF"

  mutation:
    name: frozen mutants
    runs-on: ubuntu-latest
    # Two measurements of the same tree: 659 seconds on a quiet M-series
    # laptop, and 1531 seconds on the same laptop under concurrent load. The
    # harness
    # copies the tree and runs the suite once per mutant. A CI runner is
    # slower, so the ceiling is generous — the job failing on the clock would
    # say nothing about the commit under test.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The harness enumerates the tree with `git ls-files --cached --others`
        # so a mutant runs against the tree as it is now. A shallow or detached
        # checkout still has an index, which is all it needs, but it must be a
        # git checkout and not an extracted archive: without one it fails
        # rather than skipping, deliberately.
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
          cache: true
      # 76 mutants, frozen as data in internal/mutation/testdata/mutants.json,
      # thawed one at a time against a scratch copy of the tree to ask whether
      # the check that caught each one still works.
      #
      # It had never run. The package is behind `//go:build mutation` and no
      # job here passed the tag, so `go test ./...` skipped it on every push
      # since it was written — the catalogue that exists to stop a fixed defect
      # returning quietly was itself unreachable.
      #
      # -timeout matters as much as the tag. Go's default is 10 minutes and the
      # run needs eleven, so the obvious invocation dies around mutant 66 of 76
      # with a timeout panic that looks like a broken harness.
      - name: Thaw every frozen mutant and confirm it still dies
        run: go test -tags mutation -timeout 45m -count=1 ./internal/mutation/

  surface-drift:
    name: surface drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to the same v5 the rest of this file already uses. The v5 tag
      # has moved since that SHA was chosen, which is the argument for pinning
      # stated as a fact rather than a principle.
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: go.mod
      # Every command and flag in docs/CLI.md, run three times, with the exit
      # code compared against what that surface is supposed to do rather than
      # against zero. `replay prefix` exits 1 when a diff voids the prefix, and
      # a harness that called that a failure would report the product's most
      # deliberate behaviour as a bug.
      #
      # It had never run here. Two things had to change before wiring it was
      # worth anything. It returned 0 unconditionally, so a job running it would
      # have been a check that could not fail. And `serve` was exercised blind:
      # a long-running listener either binds and blocks to the 45s timeout or
      # reports the port already in use, so eight serve surfaces times four
      # invocations spent roughly twenty-four minutes measuring the runner --
      # and on the machine where that was first measured, the port was held by a
      # stray serve the harness itself had leaked. Both are fixed in the script;
      # it now finishes in about four seconds and exits 1 on DRIFT, FLAKY or
      # TIMEOUT.
      #
      # --out keeps the JSON record off the working tree, which is tracked.
      - name: Exercise every documented surface
        run: |
          go build -o /tmp/replay ./cmd/replay
          python3 scripts/surface-drift/drift.py --bin /tmp/replay --out /tmp/surface-drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: surface-drift
          path: /tmp/surface-drift.json

  installer-drift:
    name: installer drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The installer a reader runs is the hosted copy, not this file. On
      # 2026-09-09 the hosted one was 28 lines behind and rejected --no-tui,
      # which had been merged here days earlier: the repository's version was
      # the one nobody ran.
      #
      # Advisory. A deploy lag is a fact about the website rather than a fault
      # in the commit under test, and a red cross on unrelated work is how a
      # check gets switched off.
      - name: Compare the hosted installer with this one
        run: ./scripts/installer-drift/check.sh

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
