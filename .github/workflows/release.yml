name: Release

# Builds, signs, and publishes binaries when a version tag is pushed.
# Binaries are only ever built here, never on a laptop.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # Sigstore keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The SHA pins the action, not the tool it installs. cosign-release
      # defaults to whatever is current at run time: v0.4.0 was signed by
      # cosign v2.5.2 on 2026-09-06 and the identical workflow pulled v3.0.6 the
      # next day, which defaults to the new bundle format, ignores
      # --output-signature and --output-certificate, and failed with
      # "create bundle file: open : no such file or directory".
      #
      # Pinned to the version that produced every release so far. It also keeps
      # publishing checksums.txt.pem and checksums.txt.sig, which is what every
      # copy of install.sh already in the wild looks for: an installer that
      # finds cosign and no signature refuses to install rather than proceeding
      # unverified, so changing the published format is a breaking change for
      # anyone who has not re-fetched the script. Moving to v3 bundles is a
      # deliberate migration that updates the installer first and publishes both
      # formats through a transition, not a side effect of a Tuesday.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2
      # Same again: this SHA pins the action and not syft. v0.4.0 was built
      # with syft v1.42.3 and the next day's run pulled v1.51.1, nine minor
      # versions later. It did not fail, which is the reason to pin it now
      # rather than after it does: an SBOM whose generator changes underneath a
      # release is a supply-chain document nobody can reproduce.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.42.3
      # `tags: ["v*"]` admits v1.0, V1.0.0 does not, but v1.0.0+meta and
      # vanything do, and goreleaser would publish some of them. This refuses
      # every tag outside the release grammar (the one selfupdate.ValidTag and
      # install.sh apply) before anything is built, signed or uploaded, so a
      # malformed tag fails Release and publish-shims never sees it succeed.
      # A prerelease passes: goreleaser publishes it as a GitHub prerelease
      # (`prerelease: auto`), which /releases/latest does not return, and
      # publish-shims.yml keeps it off npm and PyPI.
      - name: Refuse a tag that is not a release tag
        run: ./scripts/release-channel.sh "$GITHUB_REF_NAME"
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Read the published artifact back and check what it says.
      #
      # This is the gap v0.5.0 went through. The tree said 115 sessions at
      # prices dated 2026-09-07; the asset a stranger downloaded said 1666
      # transcripts at prices dated 2026-06-24, a denominator that counts one
      # file per agent lane and overstates the independent sample by roughly
      # fourteen times on that corpus. Both numbers had been corrected in the
      # tree. Nothing ran against the thing that was published.
      #
      # It runs after the upload rather than before, because the artifact is
      # what has to be right, and a check on a different binary is a check on
      # a different binary. A failure here means the release is already public
      # and must be pulled or superseded, which is the correct severity.
      - name: Check the published binary
        run: |
          # The runner is linux/amd64 and dist holds every platform, so the
          # binary has to be selected, not found. v0.5.1 picked
          # replay_darwin_arm64_v8.0/replay and got "Exec format error", which
          # the script reported as two failed assertions rather than as an
          # unrunnable binary. Both halves are fixed: this names the platform,
          # and the script now refuses to grade a binary it cannot execute.
          bin="$(find dist -type f -path '*linux_amd64*' -name replay | head -1)"
          [ -n "$bin" ] || { echo "no linux/amd64 binary under dist/" >&2; find dist -type f -name replay >&2; exit 1; }
          ./scripts/release-check.sh "$bin"

  # Rebuild what was just published and compare the bytes, every platform,
  # every tag.
  #
  # scripts/reproduce-release.sh reproduced v0.5.4 and v0.8.0 because somebody
  # ran it by hand, and RELEASE-CRITERIA.md recorded both as "not yet enforced":
  # a fact about two releases, not a property of releases. This makes it one.
  #
  # A separate job on a fresh runner, so the rebuild shares no build cache,
  # workspace or dist/ with the build it checks, and reads only: it compares a
  # release and has no reason to be able to change one. It runs after
  # publication for the same reason the published-binary check does: the
  # artifact is what has to be right. A failure here means the release is
  # already public and must be pulled or superseded. It detects; it does not
  # prevent.
  #
  # It compares the binary inside each archive. The archives' own bytes, the
  # Linux packages and the SBOMs are not compared, and the signature on
  # checksums.txt is not what this checks: the script binds each archive to
  # checksums.txt, and the signature on that file is a separate gate.
  #
  # It runs when the release job fails as well as when it succeeds. `needs`
  # alone skips it whenever release fails, and release fails after publishing
  # when the published-binary check refuses, so that tag got no verdict and a
  # re-run of release cannot give it one. `!cancelled()` replaces the default
  # success() condition; a cancelled run still skips it. When release did not
  # succeed there may be nothing published, so only a comparison that ran
  # (exit 1) or a release that succeeded is reported as public.
  reproduce:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Only to have a go command. The script sets GOTOOLCHAIN to the toolchain
      # go.mod names at the tag, which is the one release used.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Rebuild ${{ matrix.platform }} and compare the bytes
        # Pinned so a workflow-level `defaults: run: shell:` cannot choose the
        # shell that runs this step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_RESULT: ${{ needs.release.result }}
        # The script's status is the step's status. Writing the summary must
        # not be able to replace the verdict, which a pipe into tee does. The
        # log is echoed between stop-commands markers: on a mismatch it holds
        # the published binary's build info, which the runner must not read as
        # workflow commands.
        run: |
          rc=0
          ./scripts/reproduce-release.sh "$GITHUB_REF_NAME" "${PLATFORM%/*}" "${PLATFORM#*/}" > reproduce.log 2>&1 || rc=$?
          stop="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"
          cat reproduce.log
          echo "::$stop::"
          { echo "### $PLATFORM: exit $rc"; echo '```'; cat reproduce.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 1 ] || { [ "$rc" != 0 ] && [ "$RELEASE_RESULT" = success ]; }; then
            echo "This release is already public. This check ran after publication and did not prevent it: pull or supersede ${GITHUB_REF_NAME}." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" != 0 ]; then
            echo "The release job ended ${RELEASE_RESULT} and this check compared nothing (exit $rc), so it cannot say whether ${GITHUB_REF_NAME} was published. Read the release job's log and the release page." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
