name: Housekeeping

# Weekly hygiene pass. Keeps the issue tracker honest without closing
# anything a human has touched recently.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "status: accepted,type: security,pinned"
          exempt-pr-labels: "status: accepted,pinned"
          stale-issue-message: >
            This issue has had no activity for 45 days. It will close in 14 days
            unless someone comments or removes the stale label.
          stale-pr-message: >
            This pull request has had no activity for 45 days. It will close in
            14 days unless it is updated or the stale label is removed.
