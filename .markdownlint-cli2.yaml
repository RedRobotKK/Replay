# markdownlint-cli2 configuration. Rules are in .markdownlint.yaml.
globs:
  - "**/*.md"
ignores:
  - node_modules/**
  # AGENTS_STATE.md is a working log, not documentation. It is the shared state
  # file several agents append findings to during a survey, and it is kept
  # because the VERIFIED-PRESENT and VERIFIED-ABSENT results in it are worth
  # having. It is not written to be read as prose, and holding a scratchpad to
  # the same rules as a published page produced 104 of the 106 findings in this
  # repository without improving anything a reader sees.
  - AGENTS_STATE.md
  # Dated evidence and research records, frozen on the day they were written.
  # This repository corrects a dated record by appending to it and never by
  # rewriting it (docs/evidence/README.md says so, and git log -p is the
  # record of where that promise was broken). The findings these files carry
  # are blank lines around headings, emphasis markers and fence languages:
  # nothing a reader of the record is misled by, and nothing worth a diff
  # across the frozen files listed below to repair. Every entry is a record
  # dated on or before 2026-10-09, the day this list was made (the six under
  # docs/research/ carry their 2026-09-29 freeze in their own first lines),
  # and every entry still has at least one finding; an entry that lints
  # clean has no reason to stay here. Listed by name and not by glob, so a
  # record written after that day is linted on the day it is written, and so
  # this list cannot grow without a reviewed change to this file. The five
  # TTL files (ttl-*-2026-10-05 and ttl-amendment-2-2026-10-07) are not
  # listed: they lint clean and are protected by their own register, not by
  # this file. Added 2026-10-09, 33 entries; the full disposition is in
  # docs/evidence/closure-council-1.0-2026-10-09.md.
