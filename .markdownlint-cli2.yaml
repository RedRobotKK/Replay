# markdownlint-cli2 configuration. Rules are in .markdownlint.yaml.
globs:
  - "**/*.md"
ignores:
  - node_modules/**
  # AGENTS_STATE.md is a working log, not documentation. It is the shared state
  # file several agents append findings to during a survey, and it is kept
  # because the VERIFIED-PRESENT and VERIFIED-ABSENT results in it are worth
  # having. It is not written to be read as prose, and holding a scratchpad to
  # the same rules as a published page produced 104 of the 106 findings in this
  # repository without improving anything a reader sees.
  - AGENTS_STATE.md
  # DeepSeek's own report, preserved byte-for-byte as the evidence for WP-01.
  # Claude's independent check of it lives beside it in verification-*.md and IS
  # linted. Reformatting a model's output to satisfy a style rule would destroy
  # the one property that makes it evidence, which is that nobody edited it.
  - experiment/deepseek/wp01/deepseek-report-2026-09-28.md
  # Agent-generated reconnaissance dumps, not documentation.
  #
  # experiment/anthropic-recon/ holds four raw research inventories written by
  # delegated agents: tables of provider facts with their evidence classes and
  # source URLs. They are working evidence, read for their rows rather than as
  # prose, and the same reasoning applies as to AGENTS_STATE.md above. Holding
  # them to a published page's style produced findings about bare URLs inside
  # citation tables, which is where a bare URL belongs.
  #
  # The documents that READ them, docs/ANTHROPIC-EFFICIENCY-*.md, are linted.
  - experiment/anthropic-recon/**
