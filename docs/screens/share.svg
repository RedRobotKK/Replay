<svg xmlns="http://www.w3.org/2000/svg" width="704" height="498" viewBox="0 0 704 498" role="img" aria-label="replay share">
<rect width="704" height="498" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  replay share                                                               dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  Design c, the measured register.</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1">  1 sessions, 1 cache breaks. No paths, no spend total.</text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">  +--------------------------------------------------------------------------+</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1">  | My coding agent                                                          |</text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1">  | billed me twice.                                                         |</text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  | I only found out because I measured it.                                  |</text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  | 6%  of spend paid twice  1 cache breaks  1 sessions                      |</text>
<text x="16.0" y="216.0" xml:space="preserve" fill="#d9dce1">  | curl -fsSL https://redrobot.jp/c/c | sh                                  |</text>
<text x="16.0" y="235.0" xml:space="preserve" fill="#d9dce1">  +--------------------------------------------------------------------------+</text>
<text x="16.0" y="254.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="273.0" xml:space="preserve" fill="#d9dce1">  t tone   d design   w write the png</text>
<text x="16.0" y="292.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">d and w belong to this screen. c first, then d or w, for the others.</tspan></text>
<text x="16.0" y="311.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="330.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="349.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="368.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="387.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="406.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="425.0" xml:space="preserve" fill="#d9dce1">  ran   replay cost --share --png &lt;path&gt; --card c --tone measured</text>
<text x="16.0" y="444.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">copy it and you never need this screen again.</tspan></text>
<text x="16.0" y="463.0" xml:space="preserve" fill="#d9dce1">  share   ? keys  esc back  q quit</text>
</g>
