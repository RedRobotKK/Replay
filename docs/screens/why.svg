<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  [NOTE] not measured here: no session chosen yet</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">  Pick a session first.</text>
