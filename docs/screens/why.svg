<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  press     c   the cost list</text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  then      j k to move, enter to open one here</text>
<text x="16.0" y="216.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="235.0" xml:space="preserve" fill="#d9dce1">  notes</text>
