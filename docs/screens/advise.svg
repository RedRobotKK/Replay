<svg xmlns="http://www.w3.org/2000/svg" width="704" height="384" viewBox="0 0 704 384" role="img" aria-label="replay advise">
<rect width="704" height="384" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  What should I change?                                       replay advise  dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  Showing 2 of 3 changes worth making, across 1 transcript(s)</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">    <tspan fill="#767d87">1</tspan>  <tspan fill="#e6e8ec">cache breaks re-billed 1% of prompt tokens</tspan></text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">evidence</tspan>  1 transcript(s), 189,229 prompt tokens</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">saving</tspan>    <tspan fill="#7dc47d">0.8% of prompt tokens</tspan>                        <tspan fill="#767d87">status</tspan>  advice only</text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">do</tspan>        run replay diff on the session to see the cause of each break;</text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">               most are a changed prefix or an edited turn</text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="216.0" xml:space="preserve" fill="#d9dce1">    <tspan fill="#767d87">2</tspan>  <tspan fill="#e6e8ec">Bash inputs are 28% of prompt tokens</tspan></text>
<text x="16.0" y="235.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">evidence</tspan>  1 transcript(s), 6,601,667 prompt tokens</text>
<text x="16.0" y="254.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">saving</tspan>    <tspan fill="#7dc47d">14.1% of prompt tokens</tspan>                           <tspan fill="#767d87">status</tspan>  pending</text>
<text x="16.0" y="273.0" xml:space="preserve" fill="#d9dce1">     <tspan fill="#767d87">do</tspan>        keep tool inputs short: run scripts from files instead of inline</text>
<text x="16.0" y="292.0" xml:space="preserve" fill="#d9dce1">               heredocs, and pass paths instead of contents</text>
<text x="16.0" y="311.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="330.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">1 more in `replay advise`, ranked the same way.</tspan></text>
<text x="16.0" y="349.0" xml:space="preserve" fill="#d9dce1">  advise   ? keys  esc back  q quit</text>
</g>
</svg>
