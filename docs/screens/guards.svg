<svg xmlns="http://www.w3.org/2000/svg" width="704" height="232" viewBox="0 0 704 232" role="img" aria-label="replay guards">
<rect width="704" height="232" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  replay guards                                                              dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  Caps drawn from 1 session(s) on this machine</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">not enough evidence for a spend cap: 10 sessions is the floor, and a</text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">threshold from fewer is a threshold from noise. It would refuse live</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1">requests with the same confidence as one from three hundred sessions.</text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">Printed only. Nothing here is written to your configuration.</tspan></text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  guards   ? keys  esc back  q quit</text>
</g>
</svg>
