<svg xmlns="http://www.w3.org/2000/svg" width="704" height="498" viewBox="0 0 704 498" role="img" aria-label="replay guards">
<rect width="704" height="498" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  replay guards                                                              dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  What the proxy is enforcing right now</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">  check                 result</text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">  --------------------  ----------------------------------</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1">  proxy                 no answer; nothing is enforced</text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1">  caps set              unknown, nothing to ask</text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  refused               unknown, nothing to ask</text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  spent                 unknown, nothing to ask</text>
<text x="16.0" y="216.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="235.0" xml:space="preserve" fill="#d9dce1">  notes</text>
<text x="16.0" y="254.0" xml:space="preserve" fill="#d9dce1">  - no proxy answered: nothing here is enforcing</text>
<text x="16.0" y="273.0" xml:space="preserve" fill="#d9dce1">      anything. That is not the same as nothing</text>
<text x="16.0" y="292.0" xml:space="preserve" fill="#d9dce1">      having been refused.</text>
<text x="16.0" y="311.0" xml:space="preserve" fill="#d9dce1">      next: replay serve</text>
<text x="16.0" y="330.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="349.0" xml:space="preserve" fill="#d9dce1">  Suggested from your own spread, not applied</text>
<text x="16.0" y="368.0" xml:space="preserve" fill="#d9dce1">  not enough evidence for a spend cap: 10 sessions is the floor, and a</text>
<text x="16.0" y="387.0" xml:space="preserve" fill="#d9dce1">  threshold from fewer is a threshold from noise. It would refuse live</text>
<text x="16.0" y="406.0" xml:space="preserve" fill="#d9dce1">  requests with the same confidence as one from three hundred sessions.</text>
<text x="16.0" y="425.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">Nothing here is written to your configuration.</tspan></text>
<text x="16.0" y="444.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="463.0" xml:space="preserve" fill="#d9dce1">  guards   ? keys  esc back  q quit</text>
</g>
</svg>
