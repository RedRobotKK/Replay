<svg xmlns="http://www.w3.org/2000/svg" width="704" height="232" viewBox="0 0 704 232" role="img" aria-label="replay safe">
<rect width="704" height="232" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  replay safe                                                                dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  A 16,384-byte cap on tool results, over 1 session(s)</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">over the cap</tspan>      <tspan fill="#e6e8ec">2 block(s)</tspan></text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">removable</tspan>         8,059 bytes</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">prompt tokens</tspan>     <tspan fill="#7dc47d">276,712 once resending is counted</tspan></text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">Removing a result the agent later needs costs a re-read, and that is counted.</tspan></text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  safe   ? keys  esc back  q quit</text>
</g>
</svg>
