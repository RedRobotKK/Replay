<svg xmlns="http://www.w3.org/2000/svg" width="704" height="498" viewBox="0 0 704 498" role="img" aria-label="replay safe">
<rect width="704" height="498" rx="8" fill="#14161a"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="16.0" y="26.0" xml:space="preserve" fill="#d9dce1">  replay safe                                                                dev</text>
<text x="16.0" y="45.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="64.0" xml:space="preserve" fill="#d9dce1">  [NOTE] example data: describes nobody, shows only the shape.</text>
<text x="16.0" y="83.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="102.0" xml:space="preserve" fill="#d9dce1">  masking is on, and 2 of 3 paths are not covered by it</text>
<text x="16.0" y="121.0" xml:space="preserve" fill="#d9dce1">  Anything sent on those paths leaves this machine unmasked.</text>
<text x="16.0" y="140.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="159.0" xml:space="preserve" fill="#d9dce1">  path                      parsed            masked</text>
<text x="16.0" y="178.0" xml:space="preserve" fill="#d9dce1">  ------------------------  ----------------  ----------------</text>
<text x="16.0" y="197.0" xml:space="preserve" fill="#d9dce1">  /v1/messages              yes               yes, 14 rules</text>
<text x="16.0" y="216.0" xml:space="preserve" fill="#d9dce1">  /v1/chat/completions      against a stub    no</text>
<text x="16.0" y="235.0" xml:space="preserve" fill="#d9dce1">  /responses                no                no</text>
<text x="16.0" y="254.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="273.0" xml:space="preserve" fill="#d9dce1">  ! a path Replay does not parse cannot be masked. If you point a Grok</text>
<text x="16.0" y="292.0" xml:space="preserve" fill="#d9dce1">    or OpenAI-compatible client here, its payloads are forwarded whole.</text>
<text x="16.0" y="311.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="330.0" xml:space="preserve" fill="#d9dce1">  corpus contribution  refused, 2026-09-04    update checks  undecided</text>
<text x="16.0" y="349.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="368.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="387.0" xml:space="preserve" fill="#d9dce1"></text>
<text x="16.0" y="406.0" xml:space="preserve" fill="#d9dce1">  ran   replay serve --mask --mask-patterns</text>
<text x="16.0" y="425.0" xml:space="preserve" fill="#d9dce1">  <tspan fill="#767d87">copy it and you never need this screen again.</tspan></text>
